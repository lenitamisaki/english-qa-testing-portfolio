name: CI

# Runs the @funcional Playwright suite against the deployed app on every push
# and PR. Requires TEST_USER_EMAIL / TEST_USER_PASSWORD repo secrets — a
# pre-registered, email-confirmed account (see README "Running the automation
# suite"). The two scenarios that consume the real premium activation coupon
# are excluded here on purpose: they change real account state and are meant
# to be run deliberately, not on every push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep-invert "cupom válido|fica visível após ativação"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
